<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Values</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0E0E0E;
    --amber: #FFAF2D;
    --amber-light: #FFC965;
    --cream: #F8F3ED;
    --sand: #EDE4D8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    font-family: 'Inter Tight', Arial, sans-serif;
    color: var(--black);
    padding: 8px;
  }

  .wrap {
    background: var(--cream);
    border: 1px solid var(--sand);
    border-radius: 20px;
    padding: 34px 34px 30px;
  }

  /* ── Header ── */
  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 26px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 12.5px; font-weight: 700; letter-spacing: 2.4px; text-transform: uppercase;
    color: #B97A12;
  }
  .eyebrow i { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); }
  h1 {
    margin-top: 8px;
    font-size: 34px; font-weight: 800; letter-spacing: -1.1px; line-height: 1.05;
  }
  h1::after {
    content: ""; display: block; width: 44px; height: 5px; border-radius: 3px;
    background: var(--amber); margin-top: 10px;
  }
  .sub { margin-top: 12px; font-size: 15.5px; font-weight: 500; color: #4A4540; max-width: 560px; line-height: 1.5; }

  .progress {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 700;
  }
  .pips { display: flex; gap: 6px; }
  .pip { width: 26px; height: 6px; border-radius: 4px; background: var(--sand); transition: background .3s ease; }
  .pip.on { background: var(--amber); }

  /* ── Cards ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }
  .card {
    position: relative;
    height: 330px;
    perspective: 1200px;
    border: none;
    background: none;
    cursor: pointer;
    font: inherit;
    text-align: left;
    outline: none;
  }
  .inner {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform .65s cubic-bezier(.2,.75,.25,1);
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .card:hover:not(.flipped) .inner { transform: translateY(-5px); }
  .card:focus-visible .face { box-shadow: 0 0 0 3px var(--amber), 0 14px 30px rgba(14,14,14,.18); }

  .face {
    position: absolute; inset: 0;
    border-radius: 18px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    padding: 24px 22px;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 12px 28px rgba(14,14,14,.14);
  }

  /* Front */
  .front { background: var(--black); color: var(--cream); }
  .front::before {
    content: ""; position: absolute; left: -90px; bottom: -150px;
    width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,175,45,.28) 0%, transparent 65%);
  }
  .front::after {
    content: ""; position: absolute; left: -60px; bottom: -190px;
    width: 300px; height: 300px; border-radius: 50%;
    border: 1px solid rgba(255,175,45,.25);
    box-shadow: 0 0 0 40px rgba(255,175,45,.03);
  }
  .num { font-size: 14px; font-weight: 700; color: var(--amber); letter-spacing: 1.5px; position: relative; z-index: 1; }
  .icon {
    position: relative; z-index: 1;
    margin-top: 22px;
    width: 64px; height: 64px; border-radius: 18px;
    background: var(--amber);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(255,175,45,.35);
  }
  .icon svg { width: 32px; height: 32px; stroke: var(--black); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .title {
    position: relative; z-index: 1;
    margin-top: auto;
    font-size: 30px; font-weight: 800; line-height: 1.02; letter-spacing: -1px;
  }
  .hint {
    position: relative; z-index: 1;
    margin-top: 14px;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; color: rgba(248,243,237,.7);
  }
  .hint svg { width: 16px; height: 16px; stroke: var(--amber); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* Back */
  .back {
    background: var(--amber);
    color: var(--black);
    transform: rotateY(180deg);
  }
  .back .btitle { font-size: 21px; font-weight: 800; letter-spacing: -.5px; line-height: 1.1; }
  .back .bar { width: 34px; height: 4px; border-radius: 3px; background: var(--black); margin: 12px 0 14px; }
  .back ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .back li { position: relative; padding-left: 16px; font-size: 14.5px; font-weight: 600; line-height: 1.42; }
  .back li::before { content: ""; position: absolute; left: 0; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--black); }
  .back .hint { color: rgba(14,14,14,.6); margin-top: auto; }
  .back .hint svg { stroke: var(--black); }

  /* ── Footer ── */
  .foot {
    margin-top: 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    font-size: 14px; font-weight: 600; color: #4A4540;
  }
  .foot b { color: var(--black); }
  .reset {
    border: 1.5px solid var(--black); background: transparent; color: var(--black);
    font: inherit; font-weight: 700; font-size: 13.5px;
    padding: 9px 18px; border-radius: 999px; cursor: pointer;
    transition: background .2s ease, color .2s ease;
  }
  .reset:hover { background: var(--black); color: var(--cream); }

  .done {
    display: none;
    align-items: center; gap: 10px;
    font-weight: 700; color: var(--black);
  }
  .done.show { display: inline-flex; }
  .done i { width: 22px; height: 22px; border-radius: 50%; background: var(--amber); display: inline-flex; align-items: center; justify-content: center; }
  .done svg { width: 13px; height: 13px; stroke: var(--black); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Responsive ── */
  @media (max-width: 1000px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .wrap { padding: 24px 18px; }
    .head { flex-direction: column; align-items: flex-start; }
    .grid { grid-template-columns: 1fr; }
    .card { height: 300px; }
    h1 { font-size: 28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .inner { transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow"><i></i>Field Academy</div>
      <h1>Our Values</h1>
      <p class="sub">Our values help us stay aligned and work as one team. They describe who we are and who we want to be. Tap each card to find out more.</p>
    </div>
    <div class="progress" aria-live="polite">
      <div class="pips"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
      <span id="count">0 of 4</span>
    </div>
  </div>

  <div class="grid">

    <!-- 1. Know your stuff -->
    <button class="card" aria-pressed="false" aria-label="Know your stuff. Tap to reveal.">
      <div class="inner">
        <div class="face front">
          <div class="num">01</div>
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg></div>
          <div class="title">Know your stuff</div>
          <div class="hint"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg>Tap to flip</div>
        </div>
        <div class="face back">
          <div class="btitle">Know your stuff</div>
          <div class="bar"></div>
          <ul>
            <li>Everyone here is an expert in their field. We know our stuff.</li>
            <li>We're curious and pride ourselves on always learning, adapting and improving.</li>
            <li>There are no stupid questions here.</li>
          </ul>
          <div class="hint"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg>Tap to flip back</div>
        </div>
      </div>
    </button>

    <!-- 2. Do it right -->
    <button class="card" aria-pressed="false" aria-label="Do it right. Tap to reveal.">
      <div class="inner">
        <div class="face front">
          <div class="num">02</div>
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg></div>
          <div class="title">Do it right</div>
          <div class="hint"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg>Tap to flip</div>
        </div>
        <div class="face back">
          <div class="btitle">Do it right</div>
          <div class="bar"></div>
          <ul>
            <li>We think things through and make sure everything we do is sustainable and high quality.</li>
            <li>We always put safety above profit.</li>
            <li>We are intentional and act with integrity at all times.</li>
          </ul>
          <div class="hint"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg>Tap to flip back</div>
        </div>
      </div>
    </button>

    <!-- 3. Move fast -->
    <button class="card" aria-pressed="false" aria-label="Move fast. Tap to reveal.">
      <div class="inner">
        <div class="face front">
          <div class="num">03</div>
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
          <div class="title">Move fast</div>
          <div class="hint"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg>Tap to flip</div>
        </div>
        <div class="face back">
          <div class="btitle">Move fast</div>
          <div class="bar"></div>
          <ul>
            <li>We work at pace and with a sense of controlled urgency.</li>
            <li>We're finishers. Doers. Pragmatists.</li>
            <li>We take responsibility, rolling up our sleeves to get things done.</li>
          </ul>
          <div class="hint"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg>Tap to flip back</div>
        </div>
      </div>
    </button>

    <!-- 4. Work for the team -->
    <button class="card" aria-pressed="false" aria-label="Work for the team. Tap to reveal.">
      <div class="inner">
        <div class="face front">
          <div class="num">04</div>
          <div class="icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.7-3.4 3-5.4 6-5.4s5.3 2 6 5.4"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.7c2.4.2 4.2 2 4.8 4.8"/></svg></div>
          <div class="title">Work for the team</div>
          <div class="hint"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg>Tap to flip</div>
        </div>
        <div class="face back">
          <div class="btitle">Work for the team</div>
          <div class="bar"></div>
          <ul>
            <li>We are friendly and approachable. We make time for one another, we lean on each other.</li>
            <li>We share openly, the good and the bad.</li>
            <li>We don't hide our mistakes, we learn from them.</li>
          </ul>
          <div class="hint"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/></svg>Tap to flip back</div>
        </div>
      </div>
    </button>

  </div>

  <div class="foot">
    <span id="msg">Explore all four values to continue.</span>
    <span class="done" id="done"><i><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></i>Nice one, you've explored all our values!</span>
    <button class="reset" id="reset" type="button">Reset cards</button>
  </div>
</div>

<script>
  (function () {
    var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
    var pips = document.querySelectorAll('.pip');
    var count = document.getElementById('count');
    var msg = document.getElementById('msg');
    var done = document.getElementById('done');
    var seen = new Set();

    function update() {
      for (var i = 0; i < pips.length; i++) pips[i].classList.toggle('on', i < seen.size);
      count.textContent = seen.size + ' of ' + cards.length;
      var all = seen.size === cards.length;
      done.classList.toggle('show', all);
      msg.style.display = all ? 'none' : '';
    }

    cards.forEach(function (card, i) {
      card.addEventListener('click', function () {
        var flipped = card.classList.toggle('flipped');
        card.setAttribute('aria-pressed', flipped ? 'true' : 'false');
        if (flipped) seen.add(i);
        update();
      });
    });

    document.getElementById('reset').addEventListener('click', function () {
      cards.forEach(function (c) { c.classList.remove('flipped'); c.setAttribute('aria-pressed', 'false'); });
      seen.clear();
      update();
    });

    update();
  })();
</script>

</body>
</html>
